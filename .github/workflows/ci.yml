name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact normalized commit to build
        type: string
        default: ''
      release_call:
        description: Publish uses mandatory signed-package acceptance instead of optional unsigned acceptance
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  signing_preflight:
    if: github.event_name == 'workflow_dispatch'
    environment: macos-signing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require signing credentials without displaying their values
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: python scripts/sign_component.py preflight

  configuration:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.configuration.outputs.matrix }}
      initialized: ${{ steps.configuration.outputs.initialized }}
      language: ${{ steps.configuration.outputs.language }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generated reference icons
        run: python scripts/generate_icons.py --check
      - name: Static and initializer tests (no CLI toolchains)
        env:
          TEST_CLI_LANGUAGE: none
        run: python -m unittest discover -s tests -v
      - name: Read configured native matrix
        id: configuration
        run: python scripts/ci_config.py matrix

  native:
    needs: configuration
    if: needs.configuration.outputs.initialized == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configuration.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      TEST_CLI_LANGUAGE: ${{ matrix.language }}
      CLI_TARGET: ${{ matrix.target }}
      CLI_LANGUAGE: ${{ matrix.language }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: '1.26.10'
          cache: false
      - name: Set up Rust 1.99.1 only when selected
        if: matrix.language == 'rust'
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Select Rust 1.99.1
        if: matrix.language == 'rust'
        run: rustup default 1.99.1
      - name: Selected CLI contract tests
        run: python -m unittest discover -s tests -p test_cli.py -v
      - name: Native build and protocol smoke tests
        run: python scripts/build_cli.py --target "$CLI_TARGET" --language "$CLI_LANGUAGE"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            build/${{ matrix.target }}/*
            !build/${{ matrix.target }}/cargo/**
            !build/${{ matrix.target }}/cmake/**
          if-no-files-found: error
          retention-days: 7

  assembly:
    needs: [configuration, native]
    if: needs.configuration.outputs.initialized == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cli-macos-x64
          path: build/macos-x64
      - uses: actions/download-artifact@v4
        with:
          name: cli-macos-arm64
          path: build/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: cli-windows-x64
          path: build/windows-x64
      - name: Assemble universal macOS and x64 Windows resources
        id: assemble
        run: python scripts/ci_config.py assemble
      - uses: actions/upload-artifact@v4
        with:
          name: component-resources
          path: ${{ steps.assemble.outputs.resources }}
          if-no-files-found: error
          retention-days: 7
      - name: Download pinned free tool4D for optional branch and PR integration tests
        if: vars.FOURD_ENABLED == 'true' && github.ref_type != 'tag' && !inputs.release_call
        env:
          TOOL4D_URL: ${{ vars.TOOL4D_URL }}
          TOOL4D_SHA256: ${{ vars.TOOL4D_SHA256 }}
        run: python scripts/ci_config.py download-tool4d
      - name: Validate source, compilation and the actual unpacked compiled package
        if: vars.FOURD_ENABLED == 'true' && github.ref_type != 'tag' && !inputs.release_call
        run: python scripts/accept_local.py --repository "$GITHUB_REPOSITORY" --tool4d .tools/tool4d.app/Contents/MacOS/tool4d
      - name: Upload verified unsigned compiled package and evidence
        if: vars.FOURD_ENABLED == 'true' && github.ref_type != 'tag' && !inputs.release_call
        uses: actions/upload-artifact@v4
        with:
          name: SerialPort-compiled-component
          path: |
            dist/SerialPort.zip
            dist/SerialPort.acceptance.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve 4D acceptance diagnostics
        if: always() && vars.FOURD_ENABLED == 'true' && github.ref_type != 'tag' && !inputs.release_call
        uses: actions/upload-artifact@v4
        with:
          name: SerialPort-acceptance-diagnostics
          path: |
            build/acceptance.json
            build/source-host-status.json
            build/compiled-host-status.json
            build/compile-status.json
            build/host-status.json
          if-no-files-found: warn
          retention-days: 14

  signed_macos:
    needs: [signing_preflight, configuration, native, assembly]
    if: github.event_name == 'workflow_dispatch'
    environment: macos-signing
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cli-macos-x64
          path: build/macos-x64
      - uses: actions/download-artifact@v4
        with:
          name: cli-macos-arm64
          path: build/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: cli-windows-x64
          path: build/windows-x64
      - name: Download the pinned free compiler for mandatory signed-package host tests
        env:
          TOOL4D_URL: ${{ vars.TOOL4D_URL }}
          TOOL4D_SHA256: ${{ vars.TOOL4D_SHA256 }}
        run: python scripts/ci_config.py download-tool4d
      - name: Sign native code, compile, notarize and validate the macOS distributable
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: python scripts/sign_component.py build --root . --repository "$GITHUB_REPOSITORY" --tool4d .tools/tool4d.app/Contents/MacOS/tool4d
      - name: Upload the validated candidate for an actual download round trip
        uses: actions/upload-artifact@v4
        with:
          name: SerialPort-macOS-signing-candidate
          path: |
            dist/SerialPort.zip
            dist/SerialPort.dmg
            dist/SerialPort.signing.json
          if-no-files-found: error
          retention-days: 1
      - name: Download the exact candidate bytes
        uses: actions/download-artifact@v4
        with:
          name: SerialPort-macOS-signing-candidate
          path: build/downloaded-signed
      - name: Verify downloaded signatures, notarization tickets and real compiled-host loading
        env:
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
        run: python scripts/sign_component.py verify --root . --archive build/downloaded-signed/SerialPort.zip --evidence build/downloaded-signed/SerialPort.signing.json --tool4d .tools/tool4d.app/Contents/MacOS/tool4d
      - name: Delete isolated signing credentials even after failure or cancellation
        if: always()
        run: python scripts/sign_component.py cleanup --root .
      - name: Upload the accepted macOS signed and notarized distributable
        uses: actions/upload-artifact@v4
        with:
          name: SerialPort-macOS-signed-notarized
          path: |
            build/downloaded-signed/SerialPort.zip
            build/downloaded-signed/SerialPort.dmg
            build/downloaded-signed/SerialPort.signing.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve credential-free signing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SerialPort-signing-diagnostics
          path: |
            build/signing-status.json
            build/source-host-status.json
            build/compiled-host-status.json
            build/compile-status.json
            build/host-status.json
          if-no-files-found: warn
          retention-days: 14
